<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubernetes Architecture — The Cluster (Why Kubernetes?)</title>
<style>
  :root {
    --bg: #090d16;
    --panel: #121526;
    --panel-border: #3b1d38;
    --cp-tint: #1e0b1c;
    --wn-tint: #1c1006;
    --accent: #f43f5e;
    --accent-glow: rgba(244, 63, 94, 0.65);
    --accent-pink: #ec4899;
    --accent-orange: #f97316;
    --accent-orange-glow: rgba(249, 115, 22, 0.7);
    --accent-red: #ef4444;
    --packet: #ff5722;
    --packet-glow: rgba(255, 87, 34, 0.9);
    --text-main: #fce7f3;
    --text-dim: #94a3b8;
    --line: #4a213a;
    --region-cp-border: #ec4899;
    --region-wn-border: #f97316;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  body {
    padding: 24px 14px 32px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 {
    font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: #fb7185; text-align: center; margin: 0 0 4px;
    text-shadow: 0 0 14px rgba(251, 113, 133, 0.35);
  }
  .subtitle { text-align: center; color: #cbd5e1; font-size: 11.5px; margin: 0 0 16px; }
  .stage-label {
    text-align: center; min-height: 24px; font-size: 12.5px; color: #fff;
    margin-bottom: 12px; letter-spacing: 0.02em; line-height: 1.4;
  }
  .controls { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .step-indicator { font-size: 11.5px; color: var(--text-dim); min-width: 80px; text-align: center; font-weight: 600; font-family: inherit; }
  button {
    font-family: inherit; font-size: 11.5px; letter-spacing: 0.03em;
    background: #190e1f; color: #fb7185; border: 1px solid #be185d;
    border-radius: 6px; padding: 7px 15px; cursor: pointer;
    transition: all 0.2s ease;
  }
  button:hover {
    border-color: #f43f5e; color: #ffffff;
    box-shadow: 0 0 14px rgba(244, 63, 94, 0.5), 0 0 20px rgba(249, 115, 22, 0.3);
  }
  button:active { transform: translateY(1px); }

  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .region-box { fill: none; stroke-width: 1.4; stroke-dasharray: 4 4; }
  .region-cp { stroke: var(--region-cp-border); filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.3)); }
  .region-wn { stroke: var(--region-wn-border); filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.3)); }
  .region-neutral { stroke: #64748b; }
  .region-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; fill: #f472b6; }
  .region-wn + .region-label, rect.region-wn ~ text.region-label { fill: #fb923c !important; }

  .node-box {
    stroke-width: 1.3; transition: stroke 0.3s ease, filter 0.3s ease, fill 0.3s ease;
  }
  .node-box.cp { fill: var(--cp-tint); stroke: #ec4899; }
  .node-box.wn { fill: var(--wn-tint); stroke: #f97316; }
  .node-box.client { fill: #1a0f1b; stroke: #ef4444; }
  .node-box.neutral { fill: #160e20; stroke: #db2777; }
  .node-box.active {
    stroke: #f43f5e !important;
    filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.95)) drop-shadow(0 0 20px rgba(249, 115, 22, 0.6)) !important;
  }

  /* Highlighting distinct component types with pink, red, and orange */
  g[id*="Etcd"] .node-box, g[id*="etcd"] .node-box { stroke: #ef4444 !important; fill: #240c12 !important; }
  g[id*="Api"] .node-box, g[id*="api"] .node-box { stroke: #f43f5e !important; }
  g[id*="Sched"] .node-box, g[id*="sched"] .node-box { stroke: #ec4899 !important; }
  g[id*="Ctrl"] .node-box, g[id*="ctrl"] .node-box { stroke: #f472b6 !important; }
  g[id*="Kubelet"] .node-box, g[id*="kubelet"] .node-box { stroke: #ea580c !important; }
  g[id*="Proxy"] .node-box, g[id*="proxy"] .node-box { stroke: #f97316 !important; }
  g[id*="Cri"] .node-box, g[id*="cri"] .node-box { stroke: #fb923c !important; }
  g[id*="Cni"] .node-box, g[id*="cni"] .node-box { stroke: #fdba74 !important; }

  .node-title { fill: #ffffff; font-size: 12px; font-weight: 600; transition: fill 0.3s ease; }
  .node-title.active { fill: #fb7185; text-shadow: 0 0 8px rgba(251, 113, 133, 0.7); }
  .node-sub { fill: #cbd5e1; font-size: 9.5px; }

  .connector { stroke: var(--line); stroke-width: 1.4; fill: none; transition: stroke 0.3s ease; }
  .connector.active { stroke: #f43f5e; filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.7)); }
  .connector-dash {
    stroke: #f97316;
    stroke-dasharray: 4 5; animation: dash-flow 0.9s linear infinite;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .connector-dash.on { opacity: 1; }
  @keyframes dash-flow { to { stroke-dashoffset: -18; } }

  .packet {
    fill: #ff5722;
    filter: drop-shadow(0 0 8px #ff5722) drop-shadow(0 0 16px #ec4899);
    opacity: 0; transition: opacity 0.2s ease, cx 0.55s cubic-bezier(.4,0,.2,1), cy 0.55s cubic-bezier(.4,0,.2,1);
  }
  .packet.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .connector-dash { animation: none; }
    .packet { transition: opacity 0.2s ease; }
  }

  footer { text-align: center; color: #cbd5e1; font-size: 10px; margin-top: 22px; letter-spacing: 0.02em; }

  .step-badge {
    display: inline-block;
    background: rgba(244, 63, 94, 0.18);
    color: #fb7185;
    border: 1px solid #be185d;
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 700;
    margin-right: 8px;
    letter-spacing: 0.04em;
    vertical-align: middle;
  }
  .step-badge.step-done {
    background: rgba(34, 197, 94, 0.18);
    color: #4ade80;
    border-color: #16a34a;
  }
  kbd {
    background: #190e1f;
    border: 1px solid #be185d;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
    color: #fce7f3;
  }

</style>
</head>
<body>
<div class="wrap">
  <h1>The Cluster — Unified Control Plane</h1>
  <p class="subtitle">Declarative control system — single management entity across machines</p>
  <p class="stage-label" id="stageLabel">Press play or <kbd>Next →</kbd> to trace flow (or use <kbd>→</kbd> <kbd>←</kbd> <kbd>Space</kbd>)</p>

  <div class="controls">
    <button id="playBtn" onclick="togglePlay()">▶ Play</button>
    <button id="prevBtn" onclick="prevStep()" title="Previous step">← Prev</button>
    <button id="nextBtn" onclick="nextStep()" title="Next step">Next →</button>
    <button onclick="reset()">↺ Reset</button>
    <span id="stepIndicator" class="step-indicator">Step 0 / 8</span>
  </div>

  <svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture flow diagram for The Cluster (Why Kubernetes?)">
    <!-- Region: Control Plane -->
    <rect class="region-box region-cp" x="40" y="80" width="380" height="400" rx="14"/>
    <text class="region-label" x="56" y="102">Control Plane</text>
    <!-- Region: Worker Nodes -->
    <rect class="region-box region-wn" x="460" y="80" width="380" height="400" rx="14"/>
    <text class="region-label" x="476" y="102">Worker Nodes</text>
    <path class="connector" id="c0" d="M440 64 L440 96 L230 96 L230 130" fill="none"/>
    <path class="connector connector-dash" id="c0d" d="M440 64 L440 96 L230 96 L230 130" fill="none"/>
    <path class="connector" id="c1" d="M180 186 L180 206 L145 206 L145 220" fill="none"/>
    <path class="connector connector-dash" id="c1d" d="M180 186 L180 206 L145 206 L145 220" fill="none"/>
    <path class="connector" id="c2" d="M280 186 L280 206 L315 206 L315 220" fill="none"/>
    <path class="connector connector-dash" id="c2d" d="M280 186 L280 206 L315 206 L315 220" fill="none"/>
    <line class="connector" id="c3" x1="230" y1="186" x2="230" y2="310"/>
    <line class="connector connector-dash" id="c3d" x1="230" y1="186" x2="230" y2="310"/>
    <path class="connector" id="c4" d="M390 338 L440 338 L440 173 L490 173" fill="none"/>
    <path class="connector connector-dash" id="c4d" d="M390 338 L440 338 L440 173 L490 173" fill="none"/>
    <path class="connector" id="c5" d="M390 338 L440 338 L440 273 L490 273" fill="none"/>
    <path class="connector connector-dash" id="c5d" d="M390 338 L440 338 L440 273 L490 273" fill="none"/>
    <line class="connector" id="c6" x1="650" y1="306" x2="650" y2="340"/>
    <line class="connector connector-dash" id="c6d" x1="650" y1="306" x2="650" y2="340"/>
    <!-- Node: kubectl / Client -->
    <g id="nClient">
      <rect class="node-box client" x="340" y="14" width="200" height="50" rx="10"/>
      <text class="node-title" x="440" y="38" text-anchor="middle">kubectl / Client</text>
      <text class="node-sub" x="440" y="56" text-anchor="middle">declares desired state</text>
    </g>
    <!-- Node: kube-apiserver -->
    <g id="nApi">
      <rect class="node-box cp" x="70" y="130" width="320" height="56" rx="10"/>
      <text class="node-title" x="230" y="154" text-anchor="middle">kube-apiserver</text>
      <text class="node-sub" x="230" y="172" text-anchor="middle">entrypoint & cluster gateway</text>
    </g>
    <!-- Node: etcd -->
    <g id="nEtcd">
      <rect class="node-box cp" x="70" y="220" width="150" height="56" rx="10"/>
      <text class="node-title" x="145" y="244" text-anchor="middle">etcd</text>
      <text class="node-sub" x="145" y="262" text-anchor="middle">persists state</text>
    </g>
    <!-- Node: Controllers -->
    <g id="nCtrl">
      <rect class="node-box cp" x="240" y="220" width="150" height="56" rx="10"/>
      <text class="node-title" x="315" y="244" text-anchor="middle">Controllers</text>
      <text class="node-sub" x="315" y="262" text-anchor="middle">reconcile drift</text>
    </g>
    <!-- Node: kube-scheduler -->
    <g id="nSched">
      <rect class="node-box cp" x="70" y="310" width="320" height="56" rx="10"/>
      <text class="node-title" x="230" y="334" text-anchor="middle">kube-scheduler</text>
      <text class="node-sub" x="230" y="352" text-anchor="middle">places workloads</text>
    </g>
    <!-- Node: Worker Node 1 -->
    <g id="nNode1">
      <rect class="node-box wn" x="490" y="140" width="320" height="66" rx="10"/>
      <text class="node-title" x="650" y="164" text-anchor="middle">Worker Node 1</text>
      <text class="node-sub" x="650" y="182" text-anchor="middle">kubelet + containerd running Pod A</text>
    </g>
    <!-- Node: Worker Node 2 -->
    <g id="nNode2">
      <rect class="node-box wn" x="490" y="240" width="320" height="66" rx="10"/>
      <text class="node-title" x="650" y="264" text-anchor="middle">Worker Node 2</text>
      <text class="node-sub" x="650" y="282" text-anchor="middle">kubelet + containerd running Pod B</text>
    </g>
    <!-- Node: Cluster Overlay Network -->
    <g id="nMesh">
      <rect class="node-box wn" x="490" y="340" width="320" height="54" rx="10"/>
      <text class="node-title" x="650" y="364" text-anchor="middle">Cluster Overlay Network</text>
      <text class="node-sub" x="650" y="382" text-anchor="middle">unified pod-to-pod flat network</text>
    </g>
    <circle class="packet" id="packet" cx="440" cy="39" r="6"/>
  </svg>

  <footer>animated · dependency-free HTML/CSS/JS · Minimalist system design</footer>
</div>

<script>
const stages = [
  {
    "id": "nClient",
    "dot": {
      "x": 440,
      "y": 39
    },
    "label": "Client submits desired state manifest (kubectl apply) declaring intent rather than manual host commands",
    "conns": []
  },
  {
    "id": "nApi",
    "dot": {
      "x": 230,
      "y": 158
    },
    "label": "kube-apiserver authenticates client, validates OpenAPI schema, and verifies RBAC permissions",
    "conns": [
      "c0"
    ]
  },
  {
    "id": "nEtcd",
    "dot": {
      "x": 145,
      "y": 248
    },
    "label": "etcd commits the desired state via Raft consensus \u2014 establishing the cluster's single source of truth",
    "conns": [
      "c1"
    ]
  },
  {
    "id": "nCtrl",
    "dot": {
      "x": 315,
      "y": 248
    },
    "label": "Controller Manager detects gap between desired (2 replicas) and actual (0) state \u2014 triggers Pod creation",
    "conns": [
      "c2"
    ]
  },
  {
    "id": "nSched",
    "dot": {
      "x": 230,
      "y": 338
    },
    "label": "kube-scheduler filters nodes by compute resources & taints, scores candidates, and binds Pods to winning nodes",
    "conns": [
      "c3"
    ]
  },
  {
    "id": "nNode1",
    "dot": {
      "x": 650,
      "y": 173
    },
    "label": "Worker Node 1 kubelet receives assigned Pod, calls CRI runtime (containerd) to pull image and run Pod A",
    "conns": [
      "c4"
    ]
  },
  {
    "id": "nNode2",
    "dot": {
      "x": 650,
      "y": 273
    },
    "label": "Worker Node 2 kubelet independently starts Pod B \u2014 worker nodes execute tasks autonomously",
    "conns": [
      "c5"
    ]
  },
  {
    "id": "nMesh",
    "dot": {
      "x": 650,
      "y": 367
    },
    "label": "CNI overlay network assigns Pod IPs and creates routing paths so Pod A and Pod B communicate directly",
    "conns": [
      "c6"
    ]
  }
];
const allNodeIds = ["nClient", "nApi", "nEtcd", "nCtrl", "nSched", "nNode1", "nNode2", "nMesh"];
const allConnIds = ["c0", "c1", "c2", "c3", "c4", "c5", "c6"];
let currentStep = -1;
let playing = false;
let timer = null;
const totalStages = stages.length;
const completionMessage = 'Cluster state synchronized across all worker nodes ✓';

function updateControls() {
  const playBtn = document.getElementById('playBtn');
  const ind = document.getElementById('stepIndicator');
  if (playBtn) {
    playBtn.textContent = playing ? '⏸ Pause' : (currentStep >= 0 && currentStep < totalStages - 1 ? '▶ Resume' : '▶ Play');
  }
  if (ind) {
    ind.textContent = currentStep >= 0 ? `Step ${currentStep + 1} / ${totalStages}` : `Step 0 / ${totalStages}`;
  }
}

function clearAll() {
  allNodeIds.forEach(id => {
    const box = document.querySelector('#' + id + ' .node-box');
    const title = document.querySelector('#' + id + ' .node-title');
    if (box) box.classList.remove('active');
    if (title) title.classList.remove('active');
  });
  allConnIds.forEach(id => {
    const c = document.getElementById(id);
    const d = document.getElementById(id + 'd');
    if (c) c.classList.remove('active');
    if (d) d.classList.remove('on');
  });
}

function showStep(idx) {
  if (idx < 0 || idx >= totalStages) return;
  currentStep = idx;
  clearAll();

  const s = stages[idx];
  if (s.conns) {
    s.conns.forEach(cid => {
      const c = document.getElementById(cid);
      const d = document.getElementById(cid + 'd');
      if (c) c.classList.add('active');
      if (d) d.classList.add('on');
    });
  }
  const box = document.querySelector('#' + s.id + ' .node-box');
  const title = document.querySelector('#' + s.id + ' .node-title');
  if (box) box.classList.add('active');
  if (title) title.classList.add('active');

  const packet = document.getElementById('packet');
  if (packet) {
    packet.classList.add('on');
    packet.setAttribute('cx', s.dot.x);
    packet.setAttribute('cy', s.dot.y);
  }

  document.getElementById('stageLabel').innerHTML = '<span class="step-badge">Step ' + (idx + 1) + ' / ' + totalStages + '</span> ' + s.label;
  updateControls();
}

function pauseFlow() {
  playing = false;
  clearTimeout(timer);
  updateControls();
}

function nextStep() {
  pauseFlow();
  const nextIdx = (currentStep + 1) % totalStages;
  showStep(nextIdx);
}

function prevStep() {
  pauseFlow();
  const prevIdx = currentStep > 0 ? currentStep - 1 : totalStages - 1;
  showStep(prevIdx);
}

function reset() {
  playing = false;
  clearTimeout(timer);
  currentStep = -1;
  clearAll();
  const packet = document.getElementById('packet');
  if (packet) packet.classList.remove('on');
  document.getElementById('stageLabel').innerHTML = 'Press play or <kbd>Next →</kbd> to trace flow (or use <kbd>→</kbd> <kbd>←</kbd> <kbd>Space</kbd>)';
  updateControls();
}

function togglePlay() {
  if (playing) {
    pauseFlow();
  } else {
    playing = true;
    updateControls();
    if (currentStep >= totalStages - 1 || currentStep < 0) {
      showStep(0);
    }
    function autoStep() {
      if (!playing) return;
      if (currentStep >= totalStages - 1) {
        playing = false;
        document.getElementById('stageLabel').innerHTML = '<span class="step-badge step-done">Complete</span> ' + completionMessage;
        updateControls();
        return;
      }
      showStep(currentStep + 1);
      timer = setTimeout(autoStep, 1400);
    }
    timer = setTimeout(autoStep, 1400);
  }
}

function play() {
  togglePlay();
}

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { nextStep(); }
  else if (e.key === 'ArrowLeft') { prevStep(); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});
</script>
</body>
</html>
