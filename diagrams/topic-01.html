<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubernetes Architecture — The Cluster (Why Kubernetes?)</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #111a2e;
    --panel-border: #1e2b47;
    --cp-tint: #0f1f38;
    --wn-tint: #14231c;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.55);
    --packet: #f59e0b;
    --packet-glow: rgba(245, 158, 11, 0.6);
    --text-main: #e5edf7;
    --text-dim: #7f93b3;
    --line: #24324f;
    --region-cp-border: #2b3f66;
    --region-wn-border: #234030;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  body {
    padding: 24px 14px 32px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 {
    font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); text-align: center; margin: 0 0 4px;
  }
  .subtitle { text-align: center; color: var(--text-dim); font-size: 11.5px; margin: 0 0 16px; }
  .stage-label {
    text-align: center; min-height: 24px; font-size: 12.5px; color: var(--text-main);
    margin-bottom: 12px; letter-spacing: 0.02em; line-height: 1.4;
  }
  .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  button {
    font-family: inherit; font-size: 11.5px; letter-spacing: 0.03em;
    background: var(--panel); color: var(--accent); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 7px 15px; cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  button:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }
  button:active { transform: translateY(1px); }

  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .region-box { fill: none; stroke-width: 1.2; stroke-dasharray: 3 4; }
  .region-cp { stroke: var(--region-cp-border); }
  .region-wn { stroke: var(--region-wn-border); }
  .region-neutral { stroke: var(--panel-border); }
  .region-label { fill: var(--text-dim); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }

  .node-box {
    stroke-width: 1.2; transition: stroke 0.3s ease, filter 0.3s ease;
  }
  .node-box.cp { fill: var(--cp-tint); stroke: var(--panel-border); }
  .node-box.wn { fill: var(--wn-tint); stroke: var(--panel-border); }
  .node-box.client { fill: var(--panel); stroke: var(--panel-border); }
  .node-box.neutral { fill: var(--panel); stroke: var(--panel-border); }
  .node-box.active { stroke: var(--accent); filter: drop-shadow(0 0 8px var(--accent-glow)); }

  .node-title { fill: var(--text-main); font-size: 12px; font-weight: 600; transition: fill 0.3s ease; }
  .node-title.active { fill: var(--accent); }
  .node-sub { fill: var(--text-dim); font-size: 9.5px; }

  .connector { stroke: var(--line); stroke-width: 1.4; fill: none; transition: stroke 0.3s ease; }
  .connector.active { stroke: var(--accent); }
  .connector-dash {
    stroke-dasharray: 4 5; animation: dash-flow 0.9s linear infinite;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .connector-dash.on { opacity: 1; }
  @keyframes dash-flow { to { stroke-dashoffset: -18; } }

  .packet {
    fill: var(--packet); filter: drop-shadow(0 0 6px var(--packet-glow));
    opacity: 0; transition: opacity 0.2s ease, cx 0.55s cubic-bezier(.4,0,.2,1), cy 0.55s cubic-bezier(.4,0,.2,1);
  }
  .packet.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .connector-dash { animation: none; }
    .packet { transition: opacity 0.2s ease; }
  }

  footer { text-align: center; color: var(--text-dim); font-size: 10px; margin-top: 22px; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Cluster — Unified Control Plane</h1>
  <p class="subtitle">Declarative control system — single management entity across machines</p>
  <p class="stage-label" id="stageLabel">Press play to trace the flow</p>

  <div class="controls">
    <button id="playBtn" onclick="play()">▶ Play</button>
    <button onclick="reset()">↺ Reset</button>
  </div>

  <svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture flow diagram for The Cluster (Why Kubernetes?)">
    <!-- Region: Control Plane -->
    <rect class="region-box region-cp" x="40" y="80" width="380" height="400" rx="14"/>
    <text class="region-label" x="56" y="102">Control Plane</text>
    <!-- Region: Worker Nodes -->
    <rect class="region-box region-wn" x="460" y="80" width="380" height="400" rx="14"/>
    <text class="region-label" x="476" y="102">Worker Nodes</text>
    <path class="connector" id="c0" d="M440 64 L440 96 L230 96 L230 130" fill="none"/>
    <path class="connector connector-dash" id="c0d" d="M440 64 L440 96 L230 96 L230 130" fill="none"/>
    <path class="connector" id="c1" d="M180 186 L180 206 L145 206 L145 220" fill="none"/>
    <path class="connector connector-dash" id="c1d" d="M180 186 L180 206 L145 206 L145 220" fill="none"/>
    <path class="connector" id="c2" d="M280 186 L280 206 L315 206 L315 220" fill="none"/>
    <path class="connector connector-dash" id="c2d" d="M280 186 L280 206 L315 206 L315 220" fill="none"/>
    <line class="connector" id="c3" x1="230" y1="186" x2="230" y2="310"/>
    <line class="connector connector-dash" id="c3d" x1="230" y1="186" x2="230" y2="310"/>
    <path class="connector" id="c4" d="M390 338 L440 338 L440 173 L490 173" fill="none"/>
    <path class="connector connector-dash" id="c4d" d="M390 338 L440 338 L440 173 L490 173" fill="none"/>
    <path class="connector" id="c5" d="M390 338 L440 338 L440 273 L490 273" fill="none"/>
    <path class="connector connector-dash" id="c5d" d="M390 338 L440 338 L440 273 L490 273" fill="none"/>
    <line class="connector" id="c6" x1="650" y1="306" x2="650" y2="340"/>
    <line class="connector connector-dash" id="c6d" x1="650" y1="306" x2="650" y2="340"/>
    <!-- Node: kubectl / Client -->
    <g id="nClient">
      <rect class="node-box client" x="340" y="14" width="200" height="50" rx="10"/>
      <text class="node-title" x="440" y="38" text-anchor="middle">kubectl / Client</text>
      <text class="node-sub" x="440" y="56" text-anchor="middle">declares desired state</text>
    </g>
    <!-- Node: kube-apiserver -->
    <g id="nApi">
      <rect class="node-box cp" x="70" y="130" width="320" height="56" rx="10"/>
      <text class="node-title" x="230" y="154" text-anchor="middle">kube-apiserver</text>
      <text class="node-sub" x="230" y="172" text-anchor="middle">entrypoint & cluster gateway</text>
    </g>
    <!-- Node: etcd -->
    <g id="nEtcd">
      <rect class="node-box cp" x="70" y="220" width="150" height="56" rx="10"/>
      <text class="node-title" x="145" y="244" text-anchor="middle">etcd</text>
      <text class="node-sub" x="145" y="262" text-anchor="middle">persists state</text>
    </g>
    <!-- Node: Controllers -->
    <g id="nCtrl">
      <rect class="node-box cp" x="240" y="220" width="150" height="56" rx="10"/>
      <text class="node-title" x="315" y="244" text-anchor="middle">Controllers</text>
      <text class="node-sub" x="315" y="262" text-anchor="middle">reconcile drift</text>
    </g>
    <!-- Node: kube-scheduler -->
    <g id="nSched">
      <rect class="node-box cp" x="70" y="310" width="320" height="56" rx="10"/>
      <text class="node-title" x="230" y="334" text-anchor="middle">kube-scheduler</text>
      <text class="node-sub" x="230" y="352" text-anchor="middle">places workloads</text>
    </g>
    <!-- Node: Worker Node 1 -->
    <g id="nNode1">
      <rect class="node-box wn" x="490" y="140" width="320" height="66" rx="10"/>
      <text class="node-title" x="650" y="164" text-anchor="middle">Worker Node 1</text>
      <text class="node-sub" x="650" y="182" text-anchor="middle">kubelet + containerd running Pod A</text>
    </g>
    <!-- Node: Worker Node 2 -->
    <g id="nNode2">
      <rect class="node-box wn" x="490" y="240" width="320" height="66" rx="10"/>
      <text class="node-title" x="650" y="264" text-anchor="middle">Worker Node 2</text>
      <text class="node-sub" x="650" y="282" text-anchor="middle">kubelet + containerd running Pod B</text>
    </g>
    <!-- Node: Cluster Overlay Network -->
    <g id="nMesh">
      <rect class="node-box wn" x="490" y="340" width="320" height="54" rx="10"/>
      <text class="node-title" x="650" y="364" text-anchor="middle">Cluster Overlay Network</text>
      <text class="node-sub" x="650" y="382" text-anchor="middle">unified pod-to-pod flat network</text>
    </g>
    <circle class="packet" id="packet" cx="440" cy="39" r="6"/>
  </svg>

  <footer>animated · dependency-free HTML/CSS/JS · Dan Koe style minimalist system design</footer>
</div>

<script>
const stages = [
  {
    "id": "nClient",
    "dot": {
      "x": 440,
      "y": 39
    },
    "label": "Client submits multi-service application declaration to the cluster",
    "conns": []
  },
  {
    "id": "nApi",
    "dot": {
      "x": 230,
      "y": 158
    },
    "label": "API server validates declaration and accepts workload intent",
    "conns": [
      "c0"
    ]
  },
  {
    "id": "nEtcd",
    "dot": {
      "x": 145,
      "y": 248
    },
    "label": "etcd records the desired state into consistent cluster storage",
    "conns": [
      "c1"
    ]
  },
  {
    "id": "nCtrl",
    "dot": {
      "x": 315,
      "y": 248
    },
    "label": "Controller manager monitors cluster state and triggers replica creation",
    "conns": [
      "c2"
    ]
  },
  {
    "id": "nSched",
    "dot": {
      "x": 230,
      "y": 338
    },
    "label": "Scheduler assigns workloads across available worker nodes",
    "conns": [
      "c3"
    ]
  },
  {
    "id": "nNode1",
    "dot": {
      "x": 650,
      "y": 173
    },
    "label": "Worker Node 1 pulls images and executes Pod A",
    "conns": [
      "c4"
    ]
  },
  {
    "id": "nNode2",
    "dot": {
      "x": 650,
      "y": 273
    },
    "label": "Worker Node 2 pulls images and executes Pod B",
    "conns": [
      "c5"
    ]
  },
  {
    "id": "nMesh",
    "dot": {
      "x": 650,
      "y": 367
    },
    "label": "Overlay network connects Pods across machines seamlessly",
    "conns": [
      "c6"
    ]
  }
];
const allNodeIds = ["nClient", "nApi", "nEtcd", "nCtrl", "nSched", "nNode1", "nNode2", "nMesh"];
const allConnIds = ["c0", "c1", "c2", "c3", "c4", "c5", "c6"];
let playing = false;
let timer = null;

function clearAll() {
  allNodeIds.forEach(id => {
    const box = document.querySelector('#' + id + ' .node-box');
    const title = document.querySelector('#' + id + ' .node-title');
    if (box) box.classList.remove('active');
    if (title) title.classList.remove('active');
  });
  allConnIds.forEach(id => {
    const c = document.getElementById(id);
    const d = document.getElementById(id + 'd');
    if (c) c.classList.remove('active');
    if (d) d.classList.remove('on');
  });
}

function reset() {
  playing = false;
  clearTimeout(timer);
  clearAll();
  document.getElementById('packet').classList.remove('on');
  document.getElementById('stageLabel').textContent = 'Press play to trace the flow';
  document.getElementById('playBtn').textContent = '▶ Play';
}

function play() {
  if (playing) return;
  reset();
  playing = true;
  document.getElementById('packet').classList.add('on');
  document.getElementById('playBtn').textContent = '⏸ Running...';

  let i = 0;
  function step() {
    clearAll();
    if (i >= stages.length) {
      playing = false;
      document.getElementById('stageLabel').textContent = 'Cluster state synchronized across all worker nodes ✓';
      document.getElementById('playBtn').textContent = '▶ Play';
      return;
    }
    const s = stages[i];
    if (s.conns) {
      s.conns.forEach(cid => {
        const c = document.getElementById(cid);
        const d = document.getElementById(cid + 'd');
        if (c) c.classList.add('active');
        if (d) d.classList.add('on');
      });
    }
    const box = document.querySelector('#' + s.id + ' .node-box');
    const title = document.querySelector('#' + s.id + ' .node-title');
    if (box) box.classList.add('active');
    if (title) title.classList.add('active');

    const packet = document.getElementById('packet');
    packet.setAttribute('cx', s.dot.x);
    packet.setAttribute('cy', s.dot.y);

    document.getElementById('stageLabel').textContent = s.label;
    i++;
    timer = setTimeout(step, 1350);
  }
  step();
}
</script>
</body>
</html>
