<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubernetes Architecture — Control Plane vs. Worker Nodes</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #111a2e;
    --panel-border: #1e2b47;
    --cp-tint: #0f1f38;
    --wn-tint: #14231c;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.55);
    --packet: #f59e0b;
    --packet-glow: rgba(245, 158, 11, 0.6);
    --text-main: #e5edf7;
    --text-dim: #7f93b3;
    --line: #24324f;
    --region-cp-border: #2b3f66;
    --region-wn-border: #234030;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  body {
    padding: 24px 14px 32px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 {
    font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); text-align: center; margin: 0 0 4px;
  }
  .subtitle { text-align: center; color: var(--text-dim); font-size: 11.5px; margin: 0 0 16px; }
  .stage-label {
    text-align: center; min-height: 24px; font-size: 12.5px; color: var(--text-main);
    margin-bottom: 12px; letter-spacing: 0.02em; line-height: 1.4;
  }
  .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  button {
    font-family: inherit; font-size: 11.5px; letter-spacing: 0.03em;
    background: var(--panel); color: var(--accent); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 7px 15px; cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  button:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }
  button:active { transform: translateY(1px); }

  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .region-box { fill: none; stroke-width: 1.2; stroke-dasharray: 3 4; }
  .region-cp { stroke: var(--region-cp-border); }
  .region-wn { stroke: var(--region-wn-border); }
  .region-neutral { stroke: var(--panel-border); }
  .region-label { fill: var(--text-dim); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }

  .node-box {
    stroke-width: 1.2; transition: stroke 0.3s ease, filter 0.3s ease;
  }
  .node-box.cp { fill: var(--cp-tint); stroke: var(--panel-border); }
  .node-box.wn { fill: var(--wn-tint); stroke: var(--panel-border); }
  .node-box.client { fill: var(--panel); stroke: var(--panel-border); }
  .node-box.neutral { fill: var(--panel); stroke: var(--panel-border); }
  .node-box.active { stroke: var(--accent); filter: drop-shadow(0 0 8px var(--accent-glow)); }

  .node-title { fill: var(--text-main); font-size: 12px; font-weight: 600; transition: fill 0.3s ease; }
  .node-title.active { fill: var(--accent); }
  .node-sub { fill: var(--text-dim); font-size: 9.5px; }

  .connector { stroke: var(--line); stroke-width: 1.4; fill: none; transition: stroke 0.3s ease; }
  .connector.active { stroke: var(--accent); }
  .connector-dash {
    stroke-dasharray: 4 5; animation: dash-flow 0.9s linear infinite;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .connector-dash.on { opacity: 1; }
  @keyframes dash-flow { to { stroke-dashoffset: -18; } }

  .packet {
    fill: var(--packet); filter: drop-shadow(0 0 6px var(--packet-glow));
    opacity: 0; transition: opacity 0.2s ease, cx 0.55s cubic-bezier(.4,0,.2,1), cy 0.55s cubic-bezier(.4,0,.2,1);
  }
  .packet.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .connector-dash { animation: none; }
    .packet { transition: opacity 0.2s ease; }
  }

  footer { text-align: center; color: var(--text-dim); font-size: 10px; margin-top: 22px; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Control Plane vs. Worker Nodes — Failure Isolation</h1>
  <p class="subtitle">Separation of decision-making (brain) from physical workload execution (muscle)</p>
  <p class="stage-label" id="stageLabel">Press play to trace the flow</p>

  <div class="controls">
    <button id="playBtn" onclick="play()">▶ Play</button>
    <button onclick="reset()">↺ Reset</button>
  </div>

  <svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture flow diagram for Control Plane vs. Worker Nodes">
    <!-- Region: Control Plane (Decision Making) -->
    <rect class="region-box region-cp" x="40" y="70" width="380" height="410" rx="14"/>
    <text class="region-label" x="56" y="92">Control Plane (Decision Making)</text>
    <!-- Region: Worker Nodes (Workload Execution) -->
    <rect class="region-box region-wn" x="460" y="70" width="380" height="410" rx="14"/>
    <text class="region-label" x="476" y="92">Worker Nodes (Workload Execution)</text>
    <line class="connector" id="c0" x1="490" y1="140" x2="390" y2="140"/>
    <line class="connector connector-dash" id="c0d" x1="490" y1="140" x2="390" y2="140"/>
    <line class="connector" id="c1" x1="230" y1="170" x2="230" y2="210"/>
    <line class="connector connector-dash" id="c1d" x1="230" y1="170" x2="230" y2="210"/>
    <path class="connector" id="c2" d="M390 240 L490 240" fill="none"/>
    <path class="connector connector-dash" id="c2d" d="M390 240 L490 240" fill="none"/>
    <line class="connector" id="c3" x1="230" y1="270" x2="230" y2="310"/>
    <line class="connector connector-dash" id="c3d" x1="230" y1="270" x2="230" y2="310"/>
    <path class="connector" id="c4" d="M390 340 L490 340" fill="none"/>
    <path class="connector connector-dash" id="c4d" d="M390 340 L490 340" fill="none"/>
    <!-- Node: kube-apiserver -->
    <g id="nApi">
      <rect class="node-box cp" x="70" y="110" width="320" height="60" rx="10"/>
      <text class="node-title" x="230" y="134" text-anchor="middle">kube-apiserver</text>
      <text class="node-sub" x="230" y="152" text-anchor="middle">heartbeat monitoring & cluster state</text>
    </g>
    <!-- Node: Node Lifecycle Controller -->
    <g id="nNodeCtrl">
      <rect class="node-box cp" x="70" y="210" width="320" height="60" rx="10"/>
      <text class="node-title" x="230" y="234" text-anchor="middle">Node Lifecycle Controller</text>
      <text class="node-sub" x="230" y="252" text-anchor="middle">detects node health & missed leases</text>
    </g>
    <!-- Node: kube-scheduler -->
    <g id="nSched">
      <rect class="node-box cp" x="70" y="310" width="320" height="60" rx="10"/>
      <text class="node-title" x="230" y="334" text-anchor="middle">kube-scheduler</text>
      <text class="node-sub" x="230" y="352" text-anchor="middle">re-assigns evicted pods</text>
    </g>
    <!-- Node: Worker Node 1 (Unhealthy) -->
    <g id="nWorker1">
      <rect class="node-box wn" x="490" y="110" width="320" height="70" rx="10"/>
      <text class="node-title" x="650" y="134" text-anchor="middle">Worker Node 1 (Unhealthy)</text>
      <text class="node-sub" x="650" y="152" text-anchor="middle">kubelet stops reporting / machine failure</text>
    </g>
    <!-- Node: Eviction Queue -->
    <g id="nEvict">
      <rect class="node-box wn" x="490" y="220" width="320" height="60" rx="10"/>
      <text class="node-title" x="650" y="244" text-anchor="middle">Eviction Queue</text>
      <text class="node-sub" x="650" y="262" text-anchor="middle">pods marked for rescheduling</text>
    </g>
    <!-- Node: Worker Node 2 (Healthy) -->
    <g id="nWorker2">
      <rect class="node-box wn" x="490" y="320" width="320" height="70" rx="10"/>
      <text class="node-title" x="650" y="344" text-anchor="middle">Worker Node 2 (Healthy)</text>
      <text class="node-sub" x="650" y="362" text-anchor="middle">receives new pod replica & runs container</text>
    </g>
    <circle class="packet" id="packet" cx="650" cy="145" r="6"/>
  </svg>

  <footer>animated · dependency-free HTML/CSS/JS · Dan Koe style minimalist system design</footer>
</div>

<script>
const stages = [
  {
    "id": "nWorker1",
    "dot": {
      "x": 650,
      "y": 145
    },
    "label": "Worker Node 1 experiences hardware or network failure",
    "conns": []
  },
  {
    "id": "nApi",
    "dot": {
      "x": 230,
      "y": 140
    },
    "label": "API server marks node lease expired after heartbeat timeout",
    "conns": [
      "c0"
    ]
  },
  {
    "id": "nNodeCtrl",
    "dot": {
      "x": 230,
      "y": 240
    },
    "label": "Node controller flags node NotReady and triggers pod eviction",
    "conns": [
      "c1"
    ]
  },
  {
    "id": "nEvict",
    "dot": {
      "x": 650,
      "y": 250
    },
    "label": "Workload pods queued for relocation to available capacity",
    "conns": [
      "c2"
    ]
  },
  {
    "id": "nSched",
    "dot": {
      "x": 230,
      "y": 340
    },
    "label": "Scheduler identifies healthy Worker Node 2 and binds pod",
    "conns": [
      "c3"
    ]
  },
  {
    "id": "nWorker2",
    "dot": {
      "x": 650,
      "y": 355
    },
    "label": "Worker Node 2 starts replacement pod with zero data loss",
    "conns": [
      "c4"
    ]
  }
];
const allNodeIds = ["nApi", "nNodeCtrl", "nSched", "nWorker1", "nEvict", "nWorker2"];
const allConnIds = ["c0", "c1", "c2", "c3", "c4"];
let playing = false;
let timer = null;

function clearAll() {
  allNodeIds.forEach(id => {
    const box = document.querySelector('#' + id + ' .node-box');
    const title = document.querySelector('#' + id + ' .node-title');
    if (box) box.classList.remove('active');
    if (title) title.classList.remove('active');
  });
  allConnIds.forEach(id => {
    const c = document.getElementById(id);
    const d = document.getElementById(id + 'd');
    if (c) c.classList.remove('active');
    if (d) d.classList.remove('on');
  });
}

function reset() {
  playing = false;
  clearTimeout(timer);
  clearAll();
  document.getElementById('packet').classList.remove('on');
  document.getElementById('stageLabel').textContent = 'Press play to trace the flow';
  document.getElementById('playBtn').textContent = '▶ Play';
}

function play() {
  if (playing) return;
  reset();
  playing = true;
  document.getElementById('packet').classList.add('on');
  document.getElementById('playBtn').textContent = '⏸ Running...';

  let i = 0;
  function step() {
    clearAll();
    if (i >= stages.length) {
      playing = false;
      document.getElementById('stageLabel').textContent = 'Workload rescheduled to healthy worker domain ✓';
      document.getElementById('playBtn').textContent = '▶ Play';
      return;
    }
    const s = stages[i];
    if (s.conns) {
      s.conns.forEach(cid => {
        const c = document.getElementById(cid);
        const d = document.getElementById(cid + 'd');
        if (c) c.classList.add('active');
        if (d) d.classList.add('on');
      });
    }
    const box = document.querySelector('#' + s.id + ' .node-box');
    const title = document.querySelector('#' + s.id + ' .node-title');
    if (box) box.classList.add('active');
    if (title) title.classList.add('active');

    const packet = document.getElementById('packet');
    packet.setAttribute('cx', s.dot.x);
    packet.setAttribute('cy', s.dot.y);

    document.getElementById('stageLabel').textContent = s.label;
    i++;
    timer = setTimeout(step, 1350);
  }
  step();
}
</script>
</body>
</html>
