<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubernetes Architecture — kube-apiserver</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #111a2e;
    --panel-border: #1e2b47;
    --cp-tint: #0f1f38;
    --wn-tint: #14231c;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.55);
    --packet: #f59e0b;
    --packet-glow: rgba(245, 158, 11, 0.6);
    --text-main: #e5edf7;
    --text-dim: #7f93b3;
    --line: #24324f;
    --region-cp-border: #2b3f66;
    --region-wn-border: #234030;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  body {
    padding: 24px 14px 32px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 {
    font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); text-align: center; margin: 0 0 4px;
  }
  .subtitle { text-align: center; color: var(--text-dim); font-size: 11.5px; margin: 0 0 16px; }
  .stage-label {
    text-align: center; min-height: 24px; font-size: 12.5px; color: var(--text-main);
    margin-bottom: 12px; letter-spacing: 0.02em; line-height: 1.4;
  }
  .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  button {
    font-family: inherit; font-size: 11.5px; letter-spacing: 0.03em;
    background: var(--panel); color: var(--accent); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 7px 15px; cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  button:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }
  button:active { transform: translateY(1px); }

  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .region-box { fill: none; stroke-width: 1.2; stroke-dasharray: 3 4; }
  .region-cp { stroke: var(--region-cp-border); }
  .region-wn { stroke: var(--region-wn-border); }
  .region-neutral { stroke: var(--panel-border); }
  .region-label { fill: var(--text-dim); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }

  .node-box {
    stroke-width: 1.2; transition: stroke 0.3s ease, filter 0.3s ease;
  }
  .node-box.cp { fill: var(--cp-tint); stroke: var(--panel-border); }
  .node-box.wn { fill: var(--wn-tint); stroke: var(--panel-border); }
  .node-box.client { fill: var(--panel); stroke: var(--panel-border); }
  .node-box.neutral { fill: var(--panel); stroke: var(--panel-border); }
  .node-box.active { stroke: var(--accent); filter: drop-shadow(0 0 8px var(--accent-glow)); }

  .node-title { fill: var(--text-main); font-size: 12px; font-weight: 600; transition: fill 0.3s ease; }
  .node-title.active { fill: var(--accent); }
  .node-sub { fill: var(--text-dim); font-size: 9.5px; }

  .connector { stroke: var(--line); stroke-width: 1.4; fill: none; transition: stroke 0.3s ease; }
  .connector.active { stroke: var(--accent); }
  .connector-dash {
    stroke-dasharray: 4 5; animation: dash-flow 0.9s linear infinite;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .connector-dash.on { opacity: 1; }
  @keyframes dash-flow { to { stroke-dashoffset: -18; } }

  .packet {
    fill: var(--packet); filter: drop-shadow(0 0 6px var(--packet-glow));
    opacity: 0; transition: opacity 0.2s ease, cx 0.55s cubic-bezier(.4,0,.2,1), cy 0.55s cubic-bezier(.4,0,.2,1);
  }
  .packet.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .connector-dash { animation: none; }
    .packet { transition: opacity 0.2s ease; }
  }

  footer { text-align: center; color: var(--text-dim); font-size: 10px; margin-top: 22px; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>kube-apiserver — Request Admission Pipeline</h1>
  <p class="subtitle">Authentication, authorization, mutating & validating admission control</p>
  <p class="stage-label" id="stageLabel">Press play to trace the flow</p>

  <div class="controls">
    <button id="playBtn" onclick="play()">▶ Play</button>
    <button onclick="reset()">↺ Reset</button>
  </div>

  <svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture flow diagram for kube-apiserver">
    <!-- Region: kube-apiserver Pipeline -->
    <rect class="region-box region-cp" x="40" y="80" width="520" height="400" rx="14"/>
    <text class="region-label" x="56" y="102">kube-apiserver Pipeline</text>
    <!-- Region: Storage Backend -->
    <rect class="region-box region-neutral" x="600" y="80" width="240" height="400" rx="14"/>
    <text class="region-label" x="616" y="102">Storage Backend</text>
    <line class="connector" id="c0" x1="150" y1="66" x2="150" y2="120"/>
    <line class="connector connector-dash" id="c0d" x1="150" y1="66" x2="150" y2="120"/>
    <line class="connector" id="c1" x1="280" y1="150" x2="320" y2="150"/>
    <line class="connector connector-dash" id="c1d" x1="280" y1="150" x2="320" y2="150"/>
    <path class="connector" id="c2" d="M430 180 L430 210 L170 210 L170 240" fill="none"/>
    <path class="connector connector-dash" id="c2d" d="M430 180 L430 210 L170 210 L170 240" fill="none"/>
    <line class="connector" id="c3" x1="280" y1="270" x2="320" y2="270"/>
    <line class="connector connector-dash" id="c3d" x1="280" y1="270" x2="320" y2="270"/>
    <line class="connector" id="c4" x1="540" y1="270" x2="630" y2="270"/>
    <line class="connector connector-dash" id="c4d" x1="540" y1="270" x2="630" y2="270"/>
    <path class="connector" id="c5" d="M630 290 L410 290 L410 360" fill="none"/>
    <path class="connector connector-dash" id="c5d" d="M630 290 L410 290 L410 360" fill="none"/>
    <!-- Node: kubectl / API Client -->
    <g id="nClient">
      <rect class="node-box client" x="50" y="20" width="200" height="46" rx="10"/>
      <text class="node-title" x="150" y="44" text-anchor="middle">kubectl / API Client</text>
      <text class="node-sub" x="150" y="62" text-anchor="middle">HTTPS POST request</text>
    </g>
    <!-- Node: AuthN / AuthZ -->
    <g id="nAuth">
      <rect class="node-box cp" x="60" y="120" width="220" height="60" rx="10"/>
      <text class="node-title" x="170" y="144" text-anchor="middle">AuthN / AuthZ</text>
      <text class="node-sub" x="170" y="162" text-anchor="middle">TLS cert / token + RBAC check</text>
    </g>
    <!-- Node: Mutating Webhooks -->
    <g id="nMutating">
      <rect class="node-box cp" x="320" y="120" width="220" height="60" rx="10"/>
      <text class="node-title" x="430" y="144" text-anchor="middle">Mutating Webhooks</text>
      <text class="node-sub" x="430" y="162" text-anchor="middle">defaults & sidecar injection</text>
    </g>
    <!-- Node: Object Schema Validation -->
    <g id="nSchema">
      <rect class="node-box cp" x="60" y="240" width="220" height="60" rx="10"/>
      <text class="node-title" x="170" y="264" text-anchor="middle">Object Schema Validation</text>
      <text class="node-sub" x="170" y="282" text-anchor="middle">field syntax & required keys</text>
    </g>
    <!-- Node: Validating Webhooks -->
    <g id="nValidating">
      <rect class="node-box cp" x="320" y="240" width="220" height="60" rx="10"/>
      <text class="node-title" x="430" y="264" text-anchor="middle">Validating Webhooks</text>
      <text class="node-sub" x="430" y="282" text-anchor="middle">security policy & quota gates</text>
    </g>
    <!-- Node: Watch Notification Bus -->
    <g id="nWatch">
      <rect class="node-box cp" x="190" y="360" width="220" height="60" rx="10"/>
      <text class="node-title" x="300" y="384" text-anchor="middle">Watch Notification Bus</text>
      <text class="node-sub" x="300" y="402" text-anchor="middle">broadcasts event to informers</text>
    </g>
    <!-- Node: etcd -->
    <g id="nEtcd">
      <rect class="node-box neutral" x="630" y="220" width="180" height="90" rx="10"/>
      <text class="node-title" x="720" y="244" text-anchor="middle">etcd</text>
      <text class="node-sub" x="720" y="262" text-anchor="middle">strongly consistent KV</text>
      <text class="node-sub" x="720" y="276" text-anchor="middle">only API server speaks to etcd</text>
    </g>
    <circle class="packet" id="packet" cx="150" cy="43" r="6"/>
  </svg>

  <footer>animated · dependency-free HTML/CSS/JS · Dan Koe style minimalist system design</footer>
</div>

<script>
const stages = [
  {
    "id": "nClient",
    "dot": {
      "x": 150,
      "y": 43
    },
    "label": "Client issues HTTPS API request with bearer token or client certificate",
    "conns": []
  },
  {
    "id": "nAuth",
    "dot": {
      "x": 170,
      "y": 150
    },
    "label": "API server verifies identity and authorizes RBAC permissions",
    "conns": [
      "c0"
    ]
  },
  {
    "id": "nMutating",
    "dot": {
      "x": 430,
      "y": 150
    },
    "label": "Mutating admission controllers apply default values and inject sidecars",
    "conns": [
      "c1"
    ]
  },
  {
    "id": "nSchema",
    "dot": {
      "x": 170,
      "y": 270
    },
    "label": "API server validates object against OpenAPI schema specifications",
    "conns": [
      "c2"
    ]
  },
  {
    "id": "nValidating",
    "dot": {
      "x": 430,
      "y": 270
    },
    "label": "Validating admission webhooks enforce admission governance rules",
    "conns": [
      "c3"
    ]
  },
  {
    "id": "nEtcd",
    "dot": {
      "x": 720,
      "y": 265
    },
    "label": "Accepted object is written directly to etcd with transaction lock",
    "conns": [
      "c4"
    ]
  },
  {
    "id": "nWatch",
    "dot": {
      "x": 300,
      "y": 390
    },
    "label": "Watch notification dispatched to controllers and schedulers",
    "conns": [
      "c5"
    ]
  }
];
const allNodeIds = ["nClient", "nAuth", "nMutating", "nSchema", "nValidating", "nWatch", "nEtcd"];
const allConnIds = ["c0", "c1", "c2", "c3", "c4", "c5"];
let playing = false;
let timer = null;

function clearAll() {
  allNodeIds.forEach(id => {
    const box = document.querySelector('#' + id + ' .node-box');
    const title = document.querySelector('#' + id + ' .node-title');
    if (box) box.classList.remove('active');
    if (title) title.classList.remove('active');
  });
  allConnIds.forEach(id => {
    const c = document.getElementById(id);
    const d = document.getElementById(id + 'd');
    if (c) c.classList.remove('active');
    if (d) d.classList.remove('on');
  });
}

function reset() {
  playing = false;
  clearTimeout(timer);
  clearAll();
  document.getElementById('packet').classList.remove('on');
  document.getElementById('stageLabel').textContent = 'Press play to trace the flow';
  document.getElementById('playBtn').textContent = '▶ Play';
}

function play() {
  if (playing) return;
  reset();
  playing = true;
  document.getElementById('packet').classList.add('on');
  document.getElementById('playBtn').textContent = '⏸ Running...';

  let i = 0;
  function step() {
    clearAll();
    if (i >= stages.length) {
      playing = false;
      document.getElementById('stageLabel').textContent = 'Validated object written to persistent state store ✓';
      document.getElementById('playBtn').textContent = '▶ Play';
      return;
    }
    const s = stages[i];
    if (s.conns) {
      s.conns.forEach(cid => {
        const c = document.getElementById(cid);
        const d = document.getElementById(cid + 'd');
        if (c) c.classList.add('active');
        if (d) d.classList.add('on');
      });
    }
    const box = document.querySelector('#' + s.id + ' .node-box');
    const title = document.querySelector('#' + s.id + ' .node-title');
    if (box) box.classList.add('active');
    if (title) title.classList.add('active');

    const packet = document.getElementById('packet');
    packet.setAttribute('cx', s.dot.x);
    packet.setAttribute('cy', s.dot.y);

    document.getElementById('stageLabel').textContent = s.label;
    i++;
    timer = setTimeout(step, 1350);
  }
  step();
}
</script>
</body>
</html>
