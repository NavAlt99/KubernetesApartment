<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubernetes Architecture — kube-controller-manager</title>
<style>
  :root {
    --bg: #090d16;
    --panel: #121526;
    --panel-border: #3b1d38;
    --cp-tint: #1e0b1c;
    --wn-tint: #1c1006;
    --accent: #f43f5e;
    --accent-glow: rgba(244, 63, 94, 0.65);
    --accent-pink: #ec4899;
    --accent-orange: #f97316;
    --accent-orange-glow: rgba(249, 115, 22, 0.7);
    --accent-red: #ef4444;
    --packet: #ff5722;
    --packet-glow: rgba(255, 87, 34, 0.9);
    --text-main: #fce7f3;
    --text-dim: #94a3b8;
    --line: #4a213a;
    --region-cp-border: #ec4899;
    --region-wn-border: #f97316;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  body {
    padding: 24px 14px 32px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 {
    font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: #fb7185; text-align: center; margin: 0 0 4px;
    text-shadow: 0 0 14px rgba(251, 113, 133, 0.35);
  }
  .subtitle { text-align: center; color: #cbd5e1; font-size: 11.5px; margin: 0 0 16px; }
  .stage-label {
    text-align: center; min-height: 24px; font-size: 12.5px; color: #fff;
    margin-bottom: 12px; letter-spacing: 0.02em; line-height: 1.4;
  }
  .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  button {
    font-family: inherit; font-size: 11.5px; letter-spacing: 0.03em;
    background: #190e1f; color: #fb7185; border: 1px solid #be185d;
    border-radius: 6px; padding: 7px 15px; cursor: pointer;
    transition: all 0.2s ease;
  }
  button:hover {
    border-color: #f43f5e; color: #ffffff;
    box-shadow: 0 0 14px rgba(244, 63, 94, 0.5), 0 0 20px rgba(249, 115, 22, 0.3);
  }
  button:active { transform: translateY(1px); }

  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .region-box { fill: none; stroke-width: 1.4; stroke-dasharray: 4 4; }
  .region-cp { stroke: var(--region-cp-border); filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.3)); }
  .region-wn { stroke: var(--region-wn-border); filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.3)); }
  .region-neutral { stroke: #64748b; }
  .region-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; fill: #f472b6; }
  .region-wn + .region-label, rect.region-wn ~ text.region-label { fill: #fb923c !important; }

  .node-box {
    stroke-width: 1.3; transition: stroke 0.3s ease, filter 0.3s ease, fill 0.3s ease;
  }
  .node-box.cp { fill: var(--cp-tint); stroke: #ec4899; }
  .node-box.wn { fill: var(--wn-tint); stroke: #f97316; }
  .node-box.client { fill: #1a0f1b; stroke: #ef4444; }
  .node-box.neutral { fill: #160e20; stroke: #db2777; }
  .node-box.active {
    stroke: #f43f5e !important;
    filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.95)) drop-shadow(0 0 20px rgba(249, 115, 22, 0.6)) !important;
  }

  /* Highlighting distinct component types with pink, red, and orange */
  g[id*="Etcd"] .node-box, g[id*="etcd"] .node-box { stroke: #ef4444 !important; fill: #240c12 !important; }
  g[id*="Api"] .node-box, g[id*="api"] .node-box { stroke: #f43f5e !important; }
  g[id*="Sched"] .node-box, g[id*="sched"] .node-box { stroke: #ec4899 !important; }
  g[id*="Ctrl"] .node-box, g[id*="ctrl"] .node-box { stroke: #f472b6 !important; }
  g[id*="Kubelet"] .node-box, g[id*="kubelet"] .node-box { stroke: #ea580c !important; }
  g[id*="Proxy"] .node-box, g[id*="proxy"] .node-box { stroke: #f97316 !important; }
  g[id*="Cri"] .node-box, g[id*="cri"] .node-box { stroke: #fb923c !important; }
  g[id*="Cni"] .node-box, g[id*="cni"] .node-box { stroke: #fdba74 !important; }

  .node-title { fill: #ffffff; font-size: 12px; font-weight: 600; transition: fill 0.3s ease; }
  .node-title.active { fill: #fb7185; text-shadow: 0 0 8px rgba(251, 113, 133, 0.7); }
  .node-sub { fill: #cbd5e1; font-size: 9.5px; }

  .connector { stroke: var(--line); stroke-width: 1.4; fill: none; transition: stroke 0.3s ease; }
  .connector.active { stroke: #f43f5e; filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.7)); }
  .connector-dash {
    stroke: #f97316;
    stroke-dasharray: 4 5; animation: dash-flow 0.9s linear infinite;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .connector-dash.on { opacity: 1; }
  @keyframes dash-flow { to { stroke-dashoffset: -18; } }

  .packet {
    fill: #ff5722;
    filter: drop-shadow(0 0 8px #ff5722) drop-shadow(0 0 16px #ec4899);
    opacity: 0; transition: opacity 0.2s ease, cx 0.55s cubic-bezier(.4,0,.2,1), cy 0.55s cubic-bezier(.4,0,.2,1);
  }
  .packet.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .connector-dash { animation: none; }
    .packet { transition: opacity 0.2s ease; }
  }

  footer { text-align: center; color: #cbd5e1; font-size: 10px; margin-top: 22px; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>kube-controller-manager — Reconciliation Loops</h1>
  <p class="subtitle">Continuous control loops: watch, compare desired vs observed, correct drift</p>
  <p class="stage-label" id="stageLabel">Press play to trace the flow</p>

  <div class="controls">
    <button id="playBtn" onclick="play()">▶ Play</button>
    <button onclick="reset()">↺ Reset</button>
  </div>

  <svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture flow diagram for kube-controller-manager">
    <!-- Region: Controller Reconciliation Engine -->
    <rect class="region-box region-cp" x="40" y="80" width="480" height="400" rx="14"/>
    <text class="region-label" x="56" y="102">Controller Reconciliation Engine</text>
    <!-- Region: API Server Boundary -->
    <rect class="region-box region-neutral" x="560" y="80" width="280" height="400" rx="14"/>
    <text class="region-label" x="576" y="102">API Server Boundary</text>
    <line class="connector" id="c0" x1="580" y1="150" x2="280" y2="150"/>
    <line class="connector connector-dash" id="c0d" x1="580" y1="150" x2="280" y2="150"/>
    <line class="connector" id="c1" x1="280" y1="150" x2="300" y2="150"/>
    <line class="connector connector-dash" id="c1d" x1="280" y1="150" x2="300" y2="150"/>
    <path class="connector" id="c2" d="M400 180 L400 210 L170 210 L170 240" fill="none"/>
    <path class="connector connector-dash" id="c2d" d="M400 180 L400 210 L170 210 L170 240" fill="none"/>
    <line class="connector" id="c3" x1="280" y1="275" x2="300" y2="275"/>
    <line class="connector connector-dash" id="c3d" x1="280" y1="275" x2="300" y2="275"/>
    <line class="connector" id="c4" x1="500" y1="275" x2="580" y2="275"/>
    <line class="connector connector-dash" id="c4d" x1="500" y1="275" x2="580" y2="275"/>
    <!-- Node: kube-apiserver -->
    <g id="nApiWatch">
      <rect class="node-box neutral" x="580" y="120" width="240" height="60" rx="10"/>
      <text class="node-title" x="700" y="144" text-anchor="middle">kube-apiserver</text>
      <text class="node-sub" x="700" y="162" text-anchor="middle">watch stream of resource events</text>
    </g>
    <!-- Node: Informer / Reflector -->
    <g id="nInformer">
      <rect class="node-box cp" x="60" y="120" width="220" height="60" rx="10"/>
      <text class="node-title" x="170" y="144" text-anchor="middle">Informer / Reflector</text>
      <text class="node-sub" x="170" y="162" text-anchor="middle">caches cluster objects in memory</text>
    </g>
    <!-- Node: WorkQueue -->
    <g id="nQueue">
      <rect class="node-box cp" x="300" y="120" width="200" height="60" rx="10"/>
      <text class="node-title" x="400" y="144" text-anchor="middle">WorkQueue</text>
      <text class="node-sub" x="400" y="162" text-anchor="middle">rate-limited reconciliation keys</text>
    </g>
    <!-- Node: State Comparator -->
    <g id="nCompare">
      <rect class="node-box cp" x="60" y="240" width="220" height="70" rx="10"/>
      <text class="node-title" x="170" y="264" text-anchor="middle">State Comparator</text>
      <text class="node-sub" x="170" y="282" text-anchor="middle">desired vs observed check</text>
      <text class="node-sub" x="170" y="296" text-anchor="middle">detects missing replica</text>
    </g>
    <!-- Node: Reconciliation Worker -->
    <g id="nWorker">
      <rect class="node-box cp" x="300" y="240" width="200" height="70" rx="10"/>
      <text class="node-title" x="400" y="264" text-anchor="middle">Reconciliation Worker</text>
      <text class="node-sub" x="400" y="282" text-anchor="middle">executes idempotently</text>
      <text class="node-sub" x="400" y="296" text-anchor="middle">creates correction request</text>
    </g>
    <!-- Node: State Update -->
    <g id="nApiMutate">
      <rect class="node-box neutral" x="580" y="240" width="240" height="70" rx="10"/>
      <text class="node-title" x="700" y="264" text-anchor="middle">State Update</text>
      <text class="node-sub" x="700" y="282" text-anchor="middle">POST/PATCH to API server</text>
      <text class="node-sub" x="700" y="296" text-anchor="middle">triggers convergent action</text>
    </g>
    <circle class="packet" id="packet" cx="700" cy="150" r="6"/>
  </svg>

  <footer>animated · dependency-free HTML/CSS/JS · Dan Koe style minimalist system design</footer>
</div>

<script>
const stages = [
  {
    "id": "nApiWatch",
    "dot": {
      "x": 700,
      "y": 150
    },
    "label": "API server emits watch event notifying controller of resource change",
    "conns": []
  },
  {
    "id": "nInformer",
    "dot": {
      "x": 170,
      "y": 150
    },
    "label": "Informer updates local memory cache and enqueues object key",
    "conns": [
      "c0"
    ]
  },
  {
    "id": "nQueue",
    "dot": {
      "x": 400,
      "y": 150
    },
    "label": "WorkQueue de-duplicates events and dispatches key to available worker",
    "conns": [
      "c1"
    ]
  },
  {
    "id": "nCompare",
    "dot": {
      "x": 170,
      "y": 275
    },
    "label": "Worker compares desired spec against observed cluster status",
    "conns": [
      "c2"
    ]
  },
  {
    "id": "nWorker",
    "dot": {
      "x": 400,
      "y": 275
    },
    "label": "Drift detected: worker builds mutation request to bring cluster into alignment",
    "conns": [
      "c3"
    ]
  },
  {
    "id": "nApiMutate",
    "dot": {
      "x": 700,
      "y": 275
    },
    "label": "Worker submits mutation to API server to create replacement resources",
    "conns": [
      "c4"
    ]
  }
];
const allNodeIds = ["nApiWatch", "nInformer", "nQueue", "nCompare", "nWorker", "nApiMutate"];
const allConnIds = ["c0", "c1", "c2", "c3", "c4"];
let playing = false;
let timer = null;

function clearAll() {
  allNodeIds.forEach(id => {
    const box = document.querySelector('#' + id + ' .node-box');
    const title = document.querySelector('#' + id + ' .node-title');
    if (box) box.classList.remove('active');
    if (title) title.classList.remove('active');
  });
  allConnIds.forEach(id => {
    const c = document.getElementById(id);
    const d = document.getElementById(id + 'd');
    if (c) c.classList.remove('active');
    if (d) d.classList.remove('on');
  });
}

function reset() {
  playing = false;
  clearTimeout(timer);
  clearAll();
  document.getElementById('packet').classList.remove('on');
  document.getElementById('stageLabel').textContent = 'Press play to trace the flow';
  document.getElementById('playBtn').textContent = '▶ Play';
}

function play() {
  if (playing) return;
  reset();
  playing = true;
  document.getElementById('packet').classList.add('on');
  document.getElementById('playBtn').textContent = '⏸ Running...';

  let i = 0;
  function step() {
    clearAll();
    if (i >= stages.length) {
      playing = false;
      document.getElementById('stageLabel').textContent = 'Cluster state reconciled to match desired intent ✓';
      document.getElementById('playBtn').textContent = '▶ Play';
      return;
    }
    const s = stages[i];
    if (s.conns) {
      s.conns.forEach(cid => {
        const c = document.getElementById(cid);
        const d = document.getElementById(cid + 'd');
        if (c) c.classList.add('active');
        if (d) d.classList.add('on');
      });
    }
    const box = document.querySelector('#' + s.id + ' .node-box');
    const title = document.querySelector('#' + s.id + ' .node-title');
    if (box) box.classList.add('active');
    if (title) title.classList.add('active');

    const packet = document.getElementById('packet');
    packet.setAttribute('cx', s.dot.x);
    packet.setAttribute('cy', s.dot.y);

    document.getElementById('stageLabel').textContent = s.label;
    i++;
    timer = setTimeout(step, 1350);
  }
  step();
}
</script>
</body>
</html>
