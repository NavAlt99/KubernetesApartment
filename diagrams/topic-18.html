<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubernetes Architecture — Ingress</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #111a2e;
    --panel-border: #1e2b47;
    --cp-tint: #0f1f38;
    --wn-tint: #14231c;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.55);
    --packet: #f59e0b;
    --packet-glow: rgba(245, 158, 11, 0.6);
    --text-main: #e5edf7;
    --text-dim: #7f93b3;
    --line: #24324f;
    --region-cp-border: #2b3f66;
    --region-wn-border: #234030;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  body {
    padding: 24px 14px 32px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 {
    font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); text-align: center; margin: 0 0 4px;
  }
  .subtitle { text-align: center; color: var(--text-dim); font-size: 11.5px; margin: 0 0 16px; }
  .stage-label {
    text-align: center; min-height: 24px; font-size: 12.5px; color: var(--text-main);
    margin-bottom: 12px; letter-spacing: 0.02em; line-height: 1.4;
  }
  .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  button {
    font-family: inherit; font-size: 11.5px; letter-spacing: 0.03em;
    background: var(--panel); color: var(--accent); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 7px 15px; cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  button:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }
  button:active { transform: translateY(1px); }

  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .region-box { fill: none; stroke-width: 1.2; stroke-dasharray: 3 4; }
  .region-cp { stroke: var(--region-cp-border); }
  .region-wn { stroke: var(--region-wn-border); }
  .region-neutral { stroke: var(--panel-border); }
  .region-label { fill: var(--text-dim); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }

  .node-box {
    stroke-width: 1.2; transition: stroke 0.3s ease, filter 0.3s ease;
  }
  .node-box.cp { fill: var(--cp-tint); stroke: var(--panel-border); }
  .node-box.wn { fill: var(--wn-tint); stroke: var(--panel-border); }
  .node-box.client { fill: var(--panel); stroke: var(--panel-border); }
  .node-box.neutral { fill: var(--panel); stroke: var(--panel-border); }
  .node-box.active { stroke: var(--accent); filter: drop-shadow(0 0 8px var(--accent-glow)); }

  .node-title { fill: var(--text-main); font-size: 12px; font-weight: 600; transition: fill 0.3s ease; }
  .node-title.active { fill: var(--accent); }
  .node-sub { fill: var(--text-dim); font-size: 9.5px; }

  .connector { stroke: var(--line); stroke-width: 1.4; fill: none; transition: stroke 0.3s ease; }
  .connector.active { stroke: var(--accent); }
  .connector-dash {
    stroke-dasharray: 4 5; animation: dash-flow 0.9s linear infinite;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .connector-dash.on { opacity: 1; }
  @keyframes dash-flow { to { stroke-dashoffset: -18; } }

  .packet {
    fill: var(--packet); filter: drop-shadow(0 0 6px var(--packet-glow));
    opacity: 0; transition: opacity 0.2s ease, cx 0.55s cubic-bezier(.4,0,.2,1), cy 0.55s cubic-bezier(.4,0,.2,1);
  }
  .packet.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .connector-dash { animation: none; }
    .packet { transition: opacity 0.2s ease; }
  }

  footer { text-align: center; color: var(--text-dim); font-size: 10px; margin-top: 22px; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ingress — Layer-7 HTTP Routing & TLS</h1>
  <p class="subtitle">Terminating TLS and routing HTTP host/path traffic into cluster services</p>
  <p class="stage-label" id="stageLabel">Press play to trace the flow</p>

  <div class="controls">
    <button id="playBtn" onclick="play()">▶ Play</button>
    <button onclick="reset()">↺ Reset</button>
  </div>

  <svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture flow diagram for Ingress">
    <!-- Region: Cluster Network Ingress Pipeline -->
    <rect class="region-box region-wn" x="260" y="80" width="580" height="400" rx="14"/>
    <text class="region-label" x="276" y="102">Cluster Network Ingress Pipeline</text>
    <path class="connector" id="c0" d="M230 250 L260 250 L260 155 L290 155" fill="none"/>
    <path class="connector connector-dash" id="c0d" d="M230 250 L260 250 L260 155 L290 155" fill="none"/>
    <line class="connector" id="c1" x1="530" y1="155" x2="580" y2="155"/>
    <line class="connector connector-dash" id="c1d" x1="530" y1="155" x2="580" y2="155"/>
    <line class="connector" id="c2" x1="695" y1="190" x2="540" y2="260"/>
    <line class="connector connector-dash" id="c2d" x1="695" y1="190" x2="540" y2="260"/>
    <line class="connector" id="c3" x1="540" y1="320" x2="540" y2="370"/>
    <line class="connector connector-dash" id="c3d" x1="540" y1="320" x2="540" y2="370"/>
    <!-- Node: External Client -->
    <g id="nClient">
      <rect class="node-box client" x="50" y="220" width="180" height="60" rx="10"/>
      <text class="node-title" x="140" y="244" text-anchor="middle">External Client</text>
      <text class="node-sub" x="140" y="262" text-anchor="middle">https://api.example.com/v1</text>
    </g>
    <!-- Node: Ingress Controller -->
    <g id="nIngCtrl">
      <rect class="node-box wn" x="290" y="120" width="240" height="70" rx="10"/>
      <text class="node-title" x="410" y="144" text-anchor="middle">Ingress Controller</text>
      <text class="node-sub" x="410" y="162" text-anchor="middle">ingress-nginx / Traefik</text>
      <text class="node-sub" x="410" y="176" text-anchor="middle">terminates TLS certificate</text>
    </g>
    <!-- Node: Routing Rules Engine -->
    <g id="nRules">
      <rect class="node-box wn" x="580" y="120" width="230" height="70" rx="10"/>
      <text class="node-title" x="695" y="144" text-anchor="middle">Routing Rules Engine</text>
      <text class="node-sub" x="695" y="162" text-anchor="middle">host: api.example.com</text>
      <text class="node-sub" x="695" y="176" text-anchor="middle">path: /v1 -> svc-api</text>
    </g>
    <!-- Node: Cluster Service (svc-api) -->
    <g id="nSvc">
      <rect class="node-box cp" x="420" y="260" width="240" height="60" rx="10"/>
      <text class="node-title" x="540" y="284" text-anchor="middle">Cluster Service (svc-api)</text>
      <text class="node-sub" x="540" y="302" text-anchor="middle">abstracts backend pods</text>
    </g>
    <!-- Node: Upstream Pod Container -->
    <g id="nPod">
      <rect class="node-box wn" x="420" y="370" width="240" height="60" rx="10"/>
      <text class="node-title" x="540" y="394" text-anchor="middle">Upstream Pod Container</text>
      <text class="node-sub" x="540" y="412" text-anchor="middle">receives plain HTTP request</text>
    </g>
    <circle class="packet" id="packet" cx="140" cy="250" r="6"/>
  </svg>

  <footer>animated · dependency-free HTML/CSS/JS · Dan Koe style minimalist system design</footer>
</div>

<script>
const stages = [
  {
    "id": "nClient",
    "dot": {
      "x": 140,
      "y": 250
    },
    "label": "External client sends HTTPS request with SNI hostname",
    "conns": []
  },
  {
    "id": "nIngCtrl",
    "dot": {
      "x": 410,
      "y": 155
    },
    "label": "Ingress controller accepts TCP connection on 443 and terminates TLS",
    "conns": [
      "c0"
    ]
  },
  {
    "id": "nRules",
    "dot": {
      "x": 695,
      "y": 155
    },
    "label": "Controller matches hostname and URL path against Ingress resource rules",
    "conns": [
      "c1"
    ]
  },
  {
    "id": "nSvc",
    "dot": {
      "x": 540,
      "y": 290
    },
    "label": "Request matched to upstream service svc-api and endpoints resolved",
    "conns": [
      "c2"
    ]
  },
  {
    "id": "nPod",
    "dot": {
      "x": 540,
      "y": 400
    },
    "label": "Ingress proxies HTTP request directly to target backend pod IP",
    "conns": [
      "c3"
    ]
  }
];
const allNodeIds = ["nClient", "nIngCtrl", "nRules", "nSvc", "nPod"];
const allConnIds = ["c0", "c1", "c2", "c3"];
let playing = false;
let timer = null;

function clearAll() {
  allNodeIds.forEach(id => {
    const box = document.querySelector('#' + id + ' .node-box');
    const title = document.querySelector('#' + id + ' .node-title');
    if (box) box.classList.remove('active');
    if (title) title.classList.remove('active');
  });
  allConnIds.forEach(id => {
    const c = document.getElementById(id);
    const d = document.getElementById(id + 'd');
    if (c) c.classList.remove('active');
    if (d) d.classList.remove('on');
  });
}

function reset() {
  playing = false;
  clearTimeout(timer);
  clearAll();
  document.getElementById('packet').classList.remove('on');
  document.getElementById('stageLabel').textContent = 'Press play to trace the flow';
  document.getElementById('playBtn').textContent = '▶ Play';
}

function play() {
  if (playing) return;
  reset();
  playing = true;
  document.getElementById('packet').classList.add('on');
  document.getElementById('playBtn').textContent = '⏸ Running...';

  let i = 0;
  function step() {
    clearAll();
    if (i >= stages.length) {
      playing = false;
      document.getElementById('stageLabel').textContent = 'Layer 7 HTTP traffic routed directly to upstream pod backend ✓';
      document.getElementById('playBtn').textContent = '▶ Play';
      return;
    }
    const s = stages[i];
    if (s.conns) {
      s.conns.forEach(cid => {
        const c = document.getElementById(cid);
        const d = document.getElementById(cid + 'd');
        if (c) c.classList.add('active');
        if (d) d.classList.add('on');
      });
    }
    const box = document.querySelector('#' + s.id + ' .node-box');
    const title = document.querySelector('#' + s.id + ' .node-title');
    if (box) box.classList.add('active');
    if (title) title.classList.add('active');

    const packet = document.getElementById('packet');
    packet.setAttribute('cx', s.dot.x);
    packet.setAttribute('cy', s.dot.y);

    document.getElementById('stageLabel').textContent = s.label;
    i++;
    timer = setTimeout(step, 1350);
  }
  step();
}
</script>
</body>
</html>
