<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubernetes Architecture — Pod Disruption Budget (PDB)</title>
<style>
  :root {
    --bg: #090d16;
    --panel: #121526;
    --panel-border: #3b1d38;
    --cp-tint: #1e0b1c;
    --wn-tint: #1c1006;
    --accent: #f43f5e;
    --accent-glow: rgba(244, 63, 94, 0.65);
    --accent-pink: #ec4899;
    --accent-orange: #f97316;
    --accent-orange-glow: rgba(249, 115, 22, 0.7);
    --accent-red: #ef4444;
    --packet: #ff5722;
    --packet-glow: rgba(255, 87, 34, 0.9);
    --text-main: #fce7f3;
    --text-dim: #94a3b8;
    --line: #4a213a;
    --region-cp-border: #ec4899;
    --region-wn-border: #f97316;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  body {
    padding: 24px 14px 32px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 {
    font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: #fb7185; text-align: center; margin: 0 0 4px;
    text-shadow: 0 0 14px rgba(251, 113, 133, 0.35);
  }
  .subtitle { text-align: center; color: #cbd5e1; font-size: 11.5px; margin: 0 0 16px; }
  .stage-label {
    text-align: center; min-height: 24px; font-size: 12.5px; color: #fff;
    margin-bottom: 12px; letter-spacing: 0.02em; line-height: 1.4;
  }
  .controls { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .step-indicator { font-size: 11.5px; color: var(--text-dim); min-width: 80px; text-align: center; font-weight: 600; font-family: inherit; }
  button {
    font-family: inherit; font-size: 11.5px; letter-spacing: 0.03em;
    background: #190e1f; color: #fb7185; border: 1px solid #be185d;
    border-radius: 6px; padding: 7px 15px; cursor: pointer;
    transition: all 0.2s ease;
  }
  button:hover {
    border-color: #f43f5e; color: #ffffff;
    box-shadow: 0 0 14px rgba(244, 63, 94, 0.5), 0 0 20px rgba(249, 115, 22, 0.3);
  }
  button:active { transform: translateY(1px); }

  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .region-box { fill: none; stroke-width: 1.4; stroke-dasharray: 4 4; }
  .region-cp { stroke: var(--region-cp-border); filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.3)); }
  .region-wn { stroke: var(--region-wn-border); filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.3)); }
  .region-neutral { stroke: #64748b; }
  .region-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; fill: #f472b6; }
  .region-wn + .region-label, rect.region-wn ~ text.region-label { fill: #fb923c !important; }

  .node-box {
    stroke-width: 1.3; transition: stroke 0.3s ease, filter 0.3s ease, fill 0.3s ease;
  }
  .node-box.cp { fill: var(--cp-tint); stroke: #ec4899; }
  .node-box.wn { fill: var(--wn-tint); stroke: #f97316; }
  .node-box.client { fill: #1a0f1b; stroke: #ef4444; }
  .node-box.neutral { fill: #160e20; stroke: #db2777; }
  .node-box.active {
    stroke: #f43f5e !important;
    filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.95)) drop-shadow(0 0 20px rgba(249, 115, 22, 0.6)) !important;
  }

  /* Highlighting distinct component types with pink, red, and orange */
  g[id*="Etcd"] .node-box, g[id*="etcd"] .node-box { stroke: #ef4444 !important; fill: #240c12 !important; }
  g[id*="Api"] .node-box, g[id*="api"] .node-box { stroke: #f43f5e !important; }
  g[id*="Sched"] .node-box, g[id*="sched"] .node-box { stroke: #ec4899 !important; }
  g[id*="Ctrl"] .node-box, g[id*="ctrl"] .node-box { stroke: #f472b6 !important; }
  g[id*="Kubelet"] .node-box, g[id*="kubelet"] .node-box { stroke: #ea580c !important; }
  g[id*="Proxy"] .node-box, g[id*="proxy"] .node-box { stroke: #f97316 !important; }
  g[id*="Cri"] .node-box, g[id*="cri"] .node-box { stroke: #fb923c !important; }
  g[id*="Cni"] .node-box, g[id*="cni"] .node-box { stroke: #fdba74 !important; }

  .node-title { fill: #ffffff; font-size: 12px; font-weight: 600; transition: fill 0.3s ease; }
  .node-title.active { fill: #fb7185; text-shadow: 0 0 8px rgba(251, 113, 133, 0.7); }
  .node-sub { fill: #cbd5e1; font-size: 9.5px; }

  .connector { stroke: var(--line); stroke-width: 1.4; fill: none; transition: stroke 0.3s ease; }
  .connector.active { stroke: #f43f5e; filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.7)); }
  .connector-dash {
    stroke: #f97316;
    stroke-dasharray: 4 5; animation: dash-flow 0.9s linear infinite;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .connector-dash.on { opacity: 1; }
  @keyframes dash-flow { to { stroke-dashoffset: -18; } }

  .packet {
    fill: #ff5722;
    filter: drop-shadow(0 0 8px #ff5722) drop-shadow(0 0 16px #ec4899);
    opacity: 0; transition: opacity 0.2s ease, cx 0.55s cubic-bezier(.4,0,.2,1), cy 0.55s cubic-bezier(.4,0,.2,1);
  }
  .packet.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .connector-dash { animation: none; }
    .packet { transition: opacity 0.2s ease; }
  }

  footer { text-align: center; color: #cbd5e1; font-size: 10px; margin-top: 22px; letter-spacing: 0.02em; }

  .step-badge {
    display: inline-block;
    background: rgba(244, 63, 94, 0.18);
    color: #fb7185;
    border: 1px solid #be185d;
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 700;
    margin-right: 8px;
    letter-spacing: 0.04em;
    vertical-align: middle;
  }
  .step-badge.step-done {
    background: rgba(34, 197, 94, 0.18);
    color: #4ade80;
    border-color: #16a34a;
  }
  kbd {
    background: #190e1f;
    border: 1px solid #be185d;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
    color: #fce7f3;
  }

</style>
</head>
<body>
<div class="wrap">
  <h1>Pod Disruption Budget (PDB) — Maintenance Protection</h1>
  <p class="subtitle">Guaranteed minimum replica thresholds during voluntary node drains and upgrades</p>
  <p class="stage-label" id="stageLabel">Press play or <kbd>Next →</kbd> to trace flow (or use <kbd>→</kbd> <kbd>←</kbd> <kbd>Space</kbd>)</p>

  <div class="controls">
    <button id="playBtn" onclick="togglePlay()">▶ Play</button>
    <button id="prevBtn" onclick="prevStep()" title="Previous step">← Prev</button>
    <button id="nextBtn" onclick="nextStep()" title="Next step">Next →</button>
    <button onclick="reset()">↺ Reset</button>
    <span id="stepIndicator" class="step-indicator">Step 0 / 4</span>
  </div>

  <svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture flow diagram for Pod Disruption Budget (PDB)">
    <!-- Region: Voluntary Eviction & Disruption Budget Pipeline -->
    <rect class="region-box region-cp" x="40" y="80" width="800" height="400" rx="14"/>
    <text class="region-label" x="56" y="102">Voluntary Eviction & Disruption Budget Pipeline</text>
    <line class="connector" id="c0" x1="280" y1="170" x2="330" y2="170"/>
    <line class="connector connector-dash" id="c0d" x1="280" y1="170" x2="330" y2="170"/>
    <line class="connector" id="c1" x1="550" y1="170" x2="600" y2="170"/>
    <line class="connector connector-dash" id="c1d" x1="550" y1="170" x2="600" y2="170"/>
    <line class="connector" id="c2" x1="710" y1="210" x2="580" y2="280"/>
    <line class="connector connector-dash" id="c2d" x1="710" y1="210" x2="580" y2="280"/>
    <!-- Node: kubectl drain node-1 -->
    <g id="nDrain">
      <rect class="node-box client" x="60" y="140" width="220" height="60" rx="10"/>
      <text class="node-title" x="170" y="164" text-anchor="middle">kubectl drain node-1</text>
      <text class="node-sub" x="170" y="182" text-anchor="middle">voluntary node maintenance</text>
    </g>
    <!-- Node: Eviction API Subresource -->
    <g id="nEvictApi">
      <rect class="node-box cp" x="330" y="140" width="220" height="70" rx="10"/>
      <text class="node-title" x="440" y="164" text-anchor="middle">Eviction API Subresource</text>
      <text class="node-sub" x="440" y="182" text-anchor="middle">calls /pods/eviction</text>
      <text class="node-sub" x="440" y="196" text-anchor="middle">consults active PDBs</text>
    </g>
    <!-- Node: PDB Policy Check -->
    <g id="nPdb">
      <rect class="node-box cp" x="600" y="140" width="220" height="70" rx="10"/>
      <text class="node-title" x="710" y="164" text-anchor="middle">PDB Policy Check</text>
      <text class="node-sub" x="710" y="182" text-anchor="middle">minAvailable: 2</text>
      <text class="node-sub" x="710" y="196" text-anchor="middle">current healthy: 3 (Allowed: 1)</text>
    </g>
    <!-- Node: Gated Eviction Result -->
    <g id="nDecision">
      <rect class="node-box neutral" x="465" y="280" width="230" height="70" rx="10"/>
      <text class="node-title" x="580" y="304" text-anchor="middle">Gated Eviction Result</text>
      <text class="node-sub" x="580" y="322" text-anchor="middle">1 pod evicted safely</text>
      <text class="node-sub" x="580" y="336" text-anchor="middle">remaining drain attempts blocked if <= 2</text>
    </g>
    <circle class="packet" id="packet" cx="170" cy="170" r="6"/>
  </svg>

  <footer>animated · dependency-free HTML/CSS/JS · Minimalist system design</footer>
</div>

<script>
const stages = [
  {
    "id": "nDrain",
    "dot": {
      "x": 170,
      "y": 170
    },
    "label": "Administrator drains worker node for operating system maintenance",
    "conns": []
  },
  {
    "id": "nEvictApi",
    "dot": {
      "x": 440,
      "y": 175
    },
    "label": "Drain sends eviction requests rather than hard pod deletion",
    "conns": [
      "c0"
    ]
  },
  {
    "id": "nPdb",
    "dot": {
      "x": 710,
      "y": 175
    },
    "label": "PDB verifies remaining healthy replicas satisfy minAvailable threshold",
    "conns": [
      "c1"
    ]
  },
  {
    "id": "nDecision",
    "dot": {
      "x": 580,
      "y": 315
    },
    "label": "Eviction permitted without violating application availability requirements",
    "conns": [
      "c2"
    ]
  }
];
const allNodeIds = ["nDrain", "nEvictApi", "nPdb", "nDecision"];
const allConnIds = ["c0", "c1", "c2"];
let currentStep = -1;
let playing = false;
let timer = null;
const totalStages = stages.length;
const completionMessage = 'Disruption budget safeguarded; eviction gated safely ✓';

function updateControls() {
  const playBtn = document.getElementById('playBtn');
  const ind = document.getElementById('stepIndicator');
  if (playBtn) {
    playBtn.textContent = playing ? '⏸ Pause' : (currentStep >= 0 && currentStep < totalStages - 1 ? '▶ Resume' : '▶ Play');
  }
  if (ind) {
    ind.textContent = currentStep >= 0 ? `Step ${currentStep + 1} / ${totalStages}` : `Step 0 / ${totalStages}`;
  }
}

function clearAll() {
  allNodeIds.forEach(id => {
    const box = document.querySelector('#' + id + ' .node-box');
    const title = document.querySelector('#' + id + ' .node-title');
    if (box) box.classList.remove('active');
    if (title) title.classList.remove('active');
  });
  allConnIds.forEach(id => {
    const c = document.getElementById(id);
    const d = document.getElementById(id + 'd');
    if (c) c.classList.remove('active');
    if (d) d.classList.remove('on');
  });
}

function showStep(idx) {
  if (idx < 0 || idx >= totalStages) return;
  currentStep = idx;
  clearAll();

  const s = stages[idx];
  if (s.conns) {
    s.conns.forEach(cid => {
      const c = document.getElementById(cid);
      const d = document.getElementById(cid + 'd');
      if (c) c.classList.add('active');
      if (d) d.classList.add('on');
    });
  }
  const box = document.querySelector('#' + s.id + ' .node-box');
  const title = document.querySelector('#' + s.id + ' .node-title');
  if (box) box.classList.add('active');
  if (title) title.classList.add('active');

  const packet = document.getElementById('packet');
  if (packet) {
    packet.classList.add('on');
    packet.setAttribute('cx', s.dot.x);
    packet.setAttribute('cy', s.dot.y);
  }

  document.getElementById('stageLabel').innerHTML = '<span class="step-badge">Step ' + (idx + 1) + ' / ' + totalStages + '</span> ' + s.label;
  updateControls();
}

function pauseFlow() {
  playing = false;
  clearTimeout(timer);
  updateControls();
}

function nextStep() {
  pauseFlow();
  const nextIdx = (currentStep + 1) % totalStages;
  showStep(nextIdx);
}

function prevStep() {
  pauseFlow();
  const prevIdx = currentStep > 0 ? currentStep - 1 : totalStages - 1;
  showStep(prevIdx);
}

function reset() {
  playing = false;
  clearTimeout(timer);
  currentStep = -1;
  clearAll();
  const packet = document.getElementById('packet');
  if (packet) packet.classList.remove('on');
  document.getElementById('stageLabel').innerHTML = 'Press play or <kbd>Next →</kbd> to trace flow (or use <kbd>→</kbd> <kbd>←</kbd> <kbd>Space</kbd>)';
  updateControls();
}

function togglePlay() {
  if (playing) {
    pauseFlow();
  } else {
    playing = true;
    updateControls();
    if (currentStep >= totalStages - 1 || currentStep < 0) {
      showStep(0);
    }
    function autoStep() {
      if (!playing) return;
      if (currentStep >= totalStages - 1) {
        playing = false;
        document.getElementById('stageLabel').innerHTML = '<span class="step-badge step-done">Complete</span> ' + completionMessage;
        updateControls();
        return;
      }
      showStep(currentStep + 1);
      timer = setTimeout(autoStep, 1400);
    }
    timer = setTimeout(autoStep, 1400);
  }
}

function play() {
  togglePlay();
}

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { nextStep(); }
  else if (e.key === 'ArrowLeft') { prevStep(); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});
</script>
</body>
</html>
