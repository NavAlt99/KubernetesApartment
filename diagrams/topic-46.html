<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubernetes Architecture — LimitRange — Namespace Resource Constraints</title>
<style>
  :root {
    --bg: #090d16;
    --panel: #121526;
    --panel-border: #3b1d38;
    --cp-tint: #1e0b1c;
    --wn-tint: #1c1006;
    --accent: #f43f5e;
    --accent-glow: rgba(244, 63, 94, 0.65);
    --accent-pink: #ec4899;
    --accent-orange: #f97316;
    --accent-orange-glow: rgba(249, 115, 22, 0.7);
    --accent-red: #ef4444;
    --packet: #ff5722;
    --packet-glow: rgba(255, 87, 34, 0.9);
    --text-main: #fce7f3;
    --text-dim: #94a3b8;
    --line: #4a213a;
    --region-cp-border: #ec4899;
    --region-wn-border: #f97316;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  body {
    padding: 24px 14px 32px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(32px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 {
    font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: #fb7185; text-align: center; margin: 0 0 4px;
    text-shadow: 0 0 14px rgba(251, 113, 133, 0.35);
  }
  .subtitle { text-align: center; color: #cbd5e1; font-size: 11.5px; margin: 0 0 16px; }
  .stage-label {
    text-align: center; min-height: 24px; font-size: 12.5px; color: #fff;
    margin-bottom: 12px; letter-spacing: 0.02em; line-height: 1.4;
  }
  .controls { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .step-indicator { font-size: 11.5px; color: var(--text-dim); min-width: 80px; text-align: center; font-weight: 600; font-family: inherit; }
  button {
    font-family: inherit; font-size: 11.5px; letter-spacing: 0.03em;
    background: #190e1f; color: #fb7185; border: 1px solid #be185d;
    border-radius: 6px; padding: 7px 15px; cursor: pointer;
    transition: all 0.2s ease;
  }
  button:hover {
    border-color: #f43f5e; color: #ffffff;
    box-shadow: 0 0 14px rgba(244, 63, 94, 0.5), 0 0 20px rgba(249, 115, 22, 0.3);
  }
  button:active { transform: translateY(1px); }

  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .region-box { fill: none; stroke-width: 1.4; stroke-dasharray: 4 4; }
  .region-cp { stroke: var(--region-cp-border); filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.3)); }
  .region-wn { stroke: var(--region-wn-border); filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.3)); }
  .region-neutral { stroke: #64748b; }
  .region-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; fill: #f472b6; }
  .region-wn + .region-label, rect.region-wn ~ text.region-label { fill: #fb923c !important; }

  .node-box {
    stroke-width: 1.3; transition: stroke 0.3s ease, filter 0.3s ease, fill 0.3s ease;
  }
  .node-box.cp { fill: var(--cp-tint); stroke: #ec4899; }
  .node-box.wn { fill: var(--wn-tint); stroke: #f97316; }
  .node-box.client { fill: #1a0f1b; stroke: #ef4444; }
  .node-box.neutral { fill: #160e20; stroke: #db2777; }
  .node-box.active {
    stroke: #f43f5e !important;
    filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.95)) drop-shadow(0 0 20px rgba(249, 115, 22, 0.6)) !important;
  }

  .node-title { fill: #ffffff; font-size: 12px; font-weight: 600; transition: fill 0.3s ease; }
  .node-title.active { fill: #fb7185; text-shadow: 0 0 8px rgba(251, 113, 133, 0.7); }
  .node-sub { fill: #cbd5e1; font-size: 9.5px; }

  .connector { stroke: var(--line); stroke-width: 1.4; fill: none; transition: stroke 0.3s ease; }
  .connector.active { stroke: #f43f5e; filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.7)); }
  .connector-dash {
    stroke: #f97316;
    stroke-dasharray: 4 5; animation: dash-flow 0.9s linear infinite;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .connector-dash.on { opacity: 1; }
  @keyframes dash-flow { to { stroke-dashoffset: -18; } }

  .packet {
    fill: #ff5722;
    filter: drop-shadow(0 0 8px #ff5722) drop-shadow(0 0 16px #ec4899);
    opacity: 0; transition: opacity 0.2s ease, cx 0.55s cubic-bezier(.4,0,.2,1), cy 0.55s cubic-bezier(.4,0,.2,1);
  }
  .packet.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .connector-dash { animation: none; }
    .packet { transition: opacity 0.2s ease; }
  }

  footer { text-align: center; color: #cbd5e1; font-size: 10px; margin-top: 22px; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LimitRange — Namespace Resource Constraints</h1>
  <p class="subtitle">Microscopic compute limits, default requests, and ratio caps enforced on containers</p>
  <p class="stage-label" id="stageLabel">Press play to trace the flow</p>

  <div class="controls">
    <button id="playBtn" onclick="togglePlay()">▶ Play</button>
    <button id="prevBtn" onclick="prevStep()" title="Previous step">← Prev</button>
    <button id="nextBtn" onclick="nextStep()" title="Next step">Next →</button>
    <button onclick="reset()">↺ Reset</button>
    <span id="stepIndicator" class="step-indicator">Step 0 / 5</span>
  </div>

  <svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture flow diagram for LimitRange — Namespace Resource Constraints">
    <rect class="region-box region-cp" x="40" y="80" width="800" height="320" rx="14"/>
    <text class="region-label" x="56" y="102">Kubernetes Lifecycle &amp; Control Loop</text>
    
    <line class="connector" id="c0" x1="260" y1="172" x2="300" y2="172"/>
    <line class="connector connector-dash" id="c0d" x1="260" y1="172" x2="300" y2="172"/>
    <line class="connector" id="c1" x1="510" y1="172" x2="550" y2="172"/>
    <line class="connector connector-dash" id="c1d" x1="510" y1="172" x2="550" y2="172"/>
    <line class="connector" id="c2" x1="405" y1="205" x2="405" y2="270"/>
    <line class="connector connector-dash" id="c2d" x1="405" y1="205" x2="405" y2="270"/>
    <line class="connector" id="c3" x1="510" y1="302" x2="550" y2="302"/>
    <line class="connector connector-dash" id="c3d" x1="510" y1="302" x2="550" y2="302"/>
        <g id="nPod">
      <rect class="node-box client" x="60" y="140" width="200" height="65" rx="10"/>
      <text class="node-title" x="160" y="164" text-anchor="middle">Pod Manifest</text>
      <text class="node-sub" x="160" y="184" text-anchor="middle">omits CPU/memory requests</text>
    </g>
    <g id="nLimitRanger">
      <rect class="node-box cp" x="300" y="140" width="210" height="65" rx="10"/>
      <text class="node-title" x="405" y="164" text-anchor="middle">LimitRanger Admission</text>
      <text class="node-sub" x="405" y="184" text-anchor="middle">mutating & validating hook</text>
    </g>
    <g id="nDefaults">
      <rect class="node-box cp" x="550" y="140" width="210" height="65" rx="10"/>
      <text class="node-title" x="655" y="164" text-anchor="middle">Default Injection</text>
      <text class="node-sub" x="655" y="184" text-anchor="middle">injects default requests/limits</text>
    </g>
    <g id="nValidation">
      <rect class="node-box wn" x="300" y="270" width="210" height="65" rx="10"/>
      <text class="node-title" x="405" y="294" text-anchor="middle">Min / Max / Ratio Check</text>
      <text class="node-sub" x="405" y="314" text-anchor="middle">verifies min/max container caps</text>
    </g>
    <g id="nKubelet">
      <rect class="node-box neutral" x="550" y="270" width="210" height="65" rx="10"/>
      <text class="node-title" x="655" y="294" text-anchor="middle">Scheduled Container</text>
      <text class="node-sub" x="655" y="314" text-anchor="middle">cgroup limits enforced</text>
    </g>

    <circle class="packet" id="packet" cx="160" cy="172" r="6"/>
  </svg>

  <footer>animated · dependency-free HTML/CSS/JS · Minimalist system design</footer>
</div>

<script>
const stages = [
  {
    "id": "nPod",
    "dot": {
      "x": 160,
      "y": 172
    },
    "label": "Developer submits Pod without specifying compute requests or limits",
    "conns": []
  },
  {
    "id": "nLimitRanger",
    "dot": {
      "x": 405,
      "y": 172
    },
    "label": "LimitRanger admission controller intercepts incoming pod object",
    "conns": [
      "c0"
    ]
  },
  {
    "id": "nDefaults",
    "dot": {
      "x": 655,
      "y": 172
    },
    "label": "LimitRange automatically injects configured default requests and limits",
    "conns": [
      "c1"
    ]
  },
  {
    "id": "nValidation",
    "dot": {
      "x": 405,
      "y": 302
    },
    "label": "Validates container bounds against min, max, and maxLimitRequestRatio",
    "conns": [
      "c2"
    ]
  },
  {
    "id": "nKubelet",
    "dot": {
      "x": 655,
      "y": 302
    },
    "label": "Kubelet programs Linux cgroups on worker node with validated boundaries",
    "conns": [
      "c3"
    ]
  }
];
const allNodeIds = ["nPod", "nLimitRanger", "nDefaults", "nValidation", "nKubelet"];
const allConnIds = ["c0", "c1", "c2", "c3"];
let currentStep = -1;
let playing = false;
let timer = null;
const totalStages = stages.length;
const completionMessage = 'Flow completed successfully ✓';

function updateControls() {
  const playBtn = document.getElementById('playBtn');
  const ind = document.getElementById('stepIndicator');
  if (playBtn) {
    playBtn.textContent = playing ? '⏸ Pause' : (currentStep >= 0 && currentStep < totalStages - 1 ? '▶ Resume' : '▶ Play');
  }
  if (ind) {
    ind.textContent = currentStep >= 0 ? `Step ${currentStep + 1} / ${totalStages}` : `Step 0 / ${totalStages}`;
  }
}

function clearAll() {
  allNodeIds.forEach(id => {
    const box = document.querySelector('#' + id + ' .node-box');
    const title = document.querySelector('#' + id + ' .node-title');
    if (box) box.classList.remove('active');
    if (title) title.classList.remove('active');
  });
  allConnIds.forEach(id => {
    const c = document.getElementById(id);
    const d = document.getElementById(id + 'd');
    if (c) c.classList.remove('active');
    if (d) d.classList.remove('on');
  });
}

function showStep(idx) {
  if (idx < 0 || idx >= totalStages) return;
  currentStep = idx;
  clearAll();

  const s = stages[idx];
  if (s.conns) {
    s.conns.forEach(cid => {
      const c = document.getElementById(cid);
      const d = document.getElementById(cid + 'd');
      if (c) c.classList.add('active');
      if (d) d.classList.add('on');
    });
  }
  const box = document.querySelector('#' + s.id + ' .node-box');
  const title = document.querySelector('#' + s.id + ' .node-title');
  if (box) box.classList.add('active');
  if (title) title.classList.add('active');

  const packet = document.getElementById('packet');
  if (packet) {
    packet.classList.add('on');
    packet.setAttribute('cx', s.dot.x);
    packet.setAttribute('cy', s.dot.y);
  }

  document.getElementById('stageLabel').textContent = s.label;
  updateControls();
}

function pauseFlow() {
  playing = false;
  clearTimeout(timer);
  updateControls();
}

function nextStep() {
  pauseFlow();
  const nextIdx = (currentStep + 1) % totalStages;
  showStep(nextIdx);
}

function prevStep() {
  pauseFlow();
  const prevIdx = currentStep > 0 ? currentStep - 1 : totalStages - 1;
  showStep(prevIdx);
}

function reset() {
  playing = false;
  clearTimeout(timer);
  currentStep = -1;
  clearAll();
  const packet = document.getElementById('packet');
  if (packet) packet.classList.remove('on');
  document.getElementById('stageLabel').textContent = 'Press play or Next → to trace the flow';
  updateControls();
}

function togglePlay() {
  if (playing) {
    pauseFlow();
  } else {
    playing = true;
    updateControls();
    if (currentStep >= totalStages - 1 || currentStep < 0) {
      showStep(0);
    }
    function autoStep() {
      if (!playing) return;
      if (currentStep >= totalStages - 1) {
        playing = false;
        document.getElementById('stageLabel').textContent = completionMessage;
        updateControls();
        return;
      }
      showStep(currentStep + 1);
      timer = setTimeout(autoStep, 1400);
    }
    timer = setTimeout(autoStep, 1400);
  }
}

function play() {
  togglePlay();
}

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { nextStep(); }
  else if (e.key === 'ArrowLeft') { prevStep(); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});
</script>
</body>
</html>
