# Local lab cluster for the Kubernetes Apartment Complex demos.
# The host runs Docker; each kind node runs kubelet + containerd.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: zine
networking:
  # Keep the default kindnet CNI for the core demos. The NetworkPolicy demo
  # documents the separate-cluster requirement for a policy-enforcing CNI.
  disableDefaultCNI: false
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 8080
    protocol: TCP
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
- role: worker
- role: worker
